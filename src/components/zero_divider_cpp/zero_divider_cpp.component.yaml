---
description: This component provides commands that exercise C++ fault and arithmetic behavior so that a target's response to them can be observed. The `Raise_Exception_in_Cpp` command explicitly raises a C++ exception. When a user-implemented C++ Termination Handler (TH) is configured to forward termination events to the Ada Last Chance Handler (LCH), this command allows verification that the exception propagation pathway is functioning correctly. The `Int_Divide_By_Zero_In_Cpp` and `Fp_Divide_By_Zero_In_Cpp` commands are informational rather than authoritative. Each performs a division by zero in C++ and reports what the target does with the result. That outcome depends on the target architecture, the compiler, and the compiler and runtime flags the project is built with, so this component makes no claim about which outcome any particular configuration produces. Integer division by zero is undefined behavior in C++, so a target may trap or may return a value. Floating point division by zero on a target that implements IEEE 754 typically yields a signed infinity for a non-zero dividend and a NaN for a zero dividend, though whether such a value reaches Ada or raises an exception on the way is itself configuration dependent. Whenever a division returns to Ada without raising an exception, the returned value is reported in an event. Run these commands on the intended target to establish how that configuration behaves.
execution: passive
with:
  - Packed_Magic_Number
preamble: |
  subtype Magic_Number_Type is Packed_Magic_Number.Magic_Number_Type;
init:
  description: The magic number and the time to sleep before each command executes are provided at instantiation.
  parameters:
    - name: Magic_Number
      type: Magic_Number_Type
      description: As commands to this component crash the system, provide this number as the key value of the safety interlock mechanism that guards against unintentional execution of commands in this component.
    - name: Sleep_Before_Execute_Ms
      type: Natural
      description: The number of milliseconds to sleep after receiving a command before executing its implementation. This allows time for any events to be written by the component, if desired.
      default: "1_000"
connectors:
  - description: The command receive connector
    type: Command.T
    kind: recv_sync
  - description: This connector is used to register and respond to the component's commands.
    type: Command_Response.T
    kind: send
  - description: The system time is retrieved via this connector.
    return_type: Sys_Time.T
    kind: get
  - description: Events are sent out of this connector.
    type: Event.T
    kind: send
