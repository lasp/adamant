---
description: The requirements for the Zero Divider Cpp component.
requirements:
  - text: The component shall provide a command, that when executed, causes an unhandled exception to be thrown in C++.
  - text: The component shall provide a command, that when executed, performs an integer division by zero in C++ and reports the outcome.
  - text: The component shall provide a command, that when executed, performs a floating point division by zero in C++ and reports the outcome.
  - text: The component shall provide a protection mechanism that protects these commands from being executed accidentally.
