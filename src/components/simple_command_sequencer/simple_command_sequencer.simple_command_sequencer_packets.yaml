---
description: Packets for the Simple Command Sequencer component.
packets:
  - name: Summary_Packet
    description: Periodic summary of all sequence frames, one Sequence_Frame_Summary per frame in frame order (sequence, step, state, and whether an operator awaits a deferred reply). Its type is the summary record generated by the suite the instance is initialized with. Emitted every Summary_Packet_Period ticks; zero (the default) disables it.
