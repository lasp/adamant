# Schema for command_sequences YAML files
# This defines the structure and validation rules

type: map
mapping:
  name:
    required: true
    type: str
    desc: |
      The name of the command sequences package. This will be used as the
      Ada package name, so it must follow Ada naming conventions.

  description:
    required: false
    type: str
    desc: |
      Description of this command sequences package. This will appear in
      the generated Ada code comments.

  preamble:
    required: false
    type: str
    desc: |
      Custom preamble text to include in the generated Ada package.

  num_concurrent_sequences:
    required: true
    type: int
    range: { min: 1 }
    desc: |
      The number of sequence frames (concurrently running sequences) a
      sequencer instance initialized with this suite allocates. This also
      sizes the suite's generated summary packet ground type (one
      Sequence_Frame_Summary per frame), so the frame pool and the packet
      layout can never disagree. The upper bound -- how many frame
      summaries fit in one packet buffer -- is enforced by the model
      against the project configuration.

  command_timeout_seconds:
    required: false
    type: int
    range: { min: 0, max: 2147483 }
    desc: |
      Default timeout, in whole seconds, that the sequencer will wait for
      a sub-command's response before declaring the sequence failed. Used
      for any sequence in this suite that does not specify its own
      command_timeout_seconds. Bounded so the millisecond count always
      fits an Ada.Real_Time.Time_Span.

  with:
    required: false
    type: seq
    desc: |
      List of additional Ada packages to "with" in the generated sequences
      package. Use this when a step's arg expression references a package
      that is not pulled in automatically, e.g. an enum package for a
      qualified enumeration literal.
    sequence:
      - type: str

  sequences:
    required: true
    type: seq
    desc: |
      List of command sequence definitions. Each sequence defines a named
      command that executes a series of sub-commands.
    sequence:
      - type: map
        mapping:
          name:
            required: true
            type: str
            desc: |
              Name of this sequence. This will become a command that can be
              executed. Must follow Ada naming conventions.

          description:
            required: false
            type: str
            desc: |
              Description of what this sequence does. Will appear in generated
              code and documentation.

          arg_type:
            required: false
            type: str
            desc: |
              The Ada type for this sequence's argument. If not specified,
              the sequence takes no arguments. Must be a valid Ada type name,
              possibly qualified (e.g., "Power_Mode.T" or "Packed_U16.T").

          wait_for_command_completion:
            required: false
            type: bool
            default: true
            desc: |
              Default setting for whether to wait for each sub-command to
              complete before executing the next one. Individual steps can
              override this.

          continue_on_failure:
            required: false
            type: bool
            default: false
            desc: |
              If true, the sequence will continue executing even if a sub-command
              fails. If false, the sequence will abort on the first failure.

          response_behavior:
            required: false
            type: str
            enum: ['send_after_sequence_start', 'send_after_sequence_completion']
            desc: |
              When the sequencer replies to this sequence's own command:
              send_after_sequence_start (the default) acknowledges as soon as
              the sequence is started; send_after_sequence_completion defers
              the reply until the sequence finishes, carrying its final
              success or failure. This is static per-sequence configuration.
              Invocations through the generic Run_Sequence command choose
              their behavior per-call in the command argument instead.

          command_timeout_seconds:
            required: false
            type: int
            range: { min: 0, max: 2147483 }
            desc: |
              Override the suite-level default timeout for sub-command
              responses, in whole seconds, for this sequence only. Bounded
              so the millisecond count always fits an
              Ada.Real_Time.Time_Span.

          sequence:
            required: true
            type: seq
            desc: |
              The ordered list of steps to execute. Each step is either a
              command dispatch (`command:` + optional `arg:`) or an in-sequence
              sleep (`sleep_ms:` + integer milliseconds). The two forms are
              mutually exclusive; exactly one must be present per step.
              Validation is enforced in the model loader.
            sequence:
              - type: map
                mapping:
                  command:
                    required: false
                    type: str
                    desc: |
                      The command to execute in the format "Component.Command_Name".
                      The component must be a valid component instance name in your
                      assembly, and the command must exist on that component.
                      Mutually exclusive with `sleep:`.

                  arg:
                    required: false
                    type: str
                    desc: |
                      An Ada expression that evaluates to the argument for this
                      command. You can reference the parent sequence's argument
                      using "Arg.field_name" syntax. If the command takes no
                      argument, omit this field. Only valid alongside `command:`.

                      Examples:
                        - "Arg" - pass through the entire sequence argument
                        - "Arg.Power_Mode" - pass a field from the sequence argument
                        - "(Mode => Arg.Mode, Enable => True)" - construct a record
                        - "42" - a literal value

                  wait_for_completion:
                    required: false
                    type: bool
                    desc: |
                      Whether to wait for this specific command to complete before
                      proceeding. If not specified, uses the parent sequence's
                      wait_for_command_completion setting. Only valid alongside
                      `command:`.

                  sleep_ms:
                    required: false
                    type: text
                    desc: |
                      Milliseconds to pause the sequence. Not bus-routed; the
                      sequencer frame parks itself for the duration without
                      issuing any command. Mutually exclusive with
                      `command:`/`arg:`/`wait_for_completion:`.

                      Either a static integer (bounded to 0 .. 2**31 - 1 so it
                      always fits an Ada.Real_Time.Time_Span; enforced by the
                      model), or a dynamic reference into the sequence's
                      argument using the same "Arg[.field]..." syntax as
                      dynamic command args. A dynamic sleep's referenced field
                      must be a Packed_U32.T; its value is range-checked at
                      execution time.

                      Examples:
                        - sleep_ms: 3000            # sleep 3 seconds
                        - sleep_ms: Arg.Settle_Time # duration from the sequence argument

# Additional validation rules (enforced in the model Python code):
# - Command format must be "Component.Command" with valid identifiers, or
#   the reserved name "Sleep"
# - Referenced types in arg_type must exist in the system
# - Argument expressions must be valid Ada syntax
# - Component and command names must match instances in the assembly
