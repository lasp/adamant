# Schema for command_sequences YAML files
# This defines the structure and validation rules

type: map
mapping:
  description:
    required: false
    type: str
    desc: |
      Description of this command sequences package. This will appear in
      the generated Ada code comments.

  preamble:
    required: false
    type: str
    desc: |
      Custom preamble text to include in the generated Ada package.

  num_waiting_for_response_frames:
    required: false
    type: int
    range: { min: 0 }
    default: 0
    desc: |
      Frames for sequences that wait for their sub-commands' responses
      (wait_for_command_completion true), one concurrently running sequence
      per frame. These take frame ids 0 .. num_waiting_for_response_frames - 1. Must be
      at least 1 if any sequence in the suite waits, and exactly 0 if none
      does; both are enforced by the model. Defaults to 0.

  num_non_waiting_for_response_frames:
    required: false
    type: int
    range: { min: 0 }
    default: 0
    desc: |
      Frames for sequences that do not wait for their sub-commands' responses
      (wait_for_command_completion false), one concurrently running sequence
      per frame. These take the frame ids after the waiting-for-response frames. Must be
      at least 1 if any sequence in the suite does not wait, and exactly 0 if
      none does; both are enforced by the model. Defaults to 0.

      The pools are separate so a response still in flight to a finished
      non-waiting-for-response run can never wake a frame that is parked waiting. The two
      counts together size the suite's generated summary packet type (one
      Sequence_Frame_Summary per frame); their sum must be at least 1 and at
      most the number of summaries that fit one packet buffer, enforced by
      the model.

  command_timeout_ms:
    required: false
    type: int
    range: { min: 1, max: 2147483647 }
    desc: |
      Default timeout, in milliseconds, that the sequencer will wait for
      a sub-command's response before declaring the sequence failed. Used
      for any sequence in this suite that does not specify its own
      command_timeout_ms. Bounded so the count always fits an
      Ada.Real_Time.Time_Span.

  with:
    required: false
    type: seq
    desc: |
      List of additional Ada packages to "with" in the generated sequences
      package. Use this when a step's arg expression references a package
      that is not pulled in automatically, e.g. an enum package for a
      qualified enumeration literal.
    sequence:
      - type: str

  sequences:
    required: true
    type: seq
    desc: |
      List of command sequence definitions. Each sequence defines a named
      command that executes a series of sub-commands.
    sequence:
      - type: map
        mapping:
          name:
            required: true
            type: str
            desc: |
              Name of this sequence. This will become a command that can be
              executed. Must follow Ada naming conventions.

          description:
            required: false
            type: str
            desc: |
              Description of what this sequence does. Will appear in generated
              code and documentation.

          arg_type:
            required: false
            type: str
            desc: |
              The Ada type for this sequence's argument. If not specified,
              the sequence takes no arguments. Must be a valid Ada type name,
              possibly qualified (e.g., "Power_Mode.T" or "Packed_U16.T").

          wait_for_command_completion:
            required: false
            type: bool
            default: true
            desc: |
              Whether to wait for each sub-command's response before executing
              the next step. Applies to every command step of the sequence.

          continue_on_failure:
            required: false
            type: bool
            default: false
            desc: |
              If true, the sequence will continue executing even if a sub-command
              fails. If false, the sequence will abort on the first failure.

              A sub-command failure is only visible when the sequence waits for
              its responses, so setting this key to false on a sequence with
              wait_for_command_completion: false is rejected: such a sequence
              could never abort.

          response_behavior:
            required: false
            type: str
            enum: ['send_after_sequence_start', 'send_after_sequence_completion']
            desc: |
              When the sequencer replies to this sequence's own command:
              send_after_sequence_start (the default) acknowledges as soon as
              the sequence is started; send_after_sequence_completion defers
              the reply until the sequence finishes, carrying its final
              success or failure. Static per-sequence configuration; the
              generic Run_Sequence command uses it too.

          command_timeout_ms:
            required: false
            type: int
            range: { min: 1, max: 2147483647 }
            desc: |
              Override the suite-level default timeout for sub-command
              responses, in milliseconds, for this sequence only. Bounded
              so the count always fits an Ada.Real_Time.Time_Span.

          sequence:
            required: true
            type: seq
            desc: |
              The ordered list of steps to execute. Each step is either a
              command dispatch (`command:` + optional `arg:`) or an in-sequence
              sleep (`sleep_ms:` + integer milliseconds). The two forms are
              mutually exclusive; exactly one must be present per step.
              Validation is enforced in the model loader.
            sequence:
              - type: map
                mapping:
                  command:
                    required: false
                    type: str
                    desc: |
                      The command to execute in the format "Component.Command_Name".
                      The component must be a valid component instance name in your
                      assembly, and the command must exist on that component.
                      Mutually exclusive with `sleep:`.

                  arg:
                    required: false
                    type: str
                    desc: |
                      The argument for this command: either a reference into the
                      parent sequence's argument ("Arg", or a field path such as
                      "Arg.Power_Mode"), resolved per call, or a static Ada
                      expression that does not mention Arg, baked in at build
                      time. Mixing the two in one expression is rejected. If the
                      command takes no argument, omit this field. Only valid
                      alongside `command:`.

                      Examples:
                        - "Arg" - pass through the entire sequence argument
                        - "Arg.Power_Mode" - pass a field from the sequence argument
                        - "(Mode => Low, Enable => True)" - construct a record from literals
                        - "42" - a literal value

                  sleep_ms:
                    required: false
                    type: text
                    desc: |
                      Milliseconds to pause the sequence. Not bus-routed; the
                      sequencer frame parks itself for the duration without
                      issuing any command. Mutually exclusive with
                      `command:`/`arg:`.

                      Either a static integer (0 .. 2**31 - 1, so it always fits
                      an Ada.Real_Time.Time_Span; enforced by the model), or a
                      dynamic reference into the sequence's argument using the
                      same "Arg[.field]..." syntax as dynamic command args. A
                      dynamic sleep's referenced field must be a
                      Packed_Natural.T, which the resolver validates at
                      execution time.

                      Examples:
                        - sleep_ms: 3000            # sleep 3 seconds
                        - sleep_ms: Arg.Settle_Time # duration from the sequence argument

# Additional validation rules (enforced in the model Python code):
# - Command format must be "Component.Command" with valid identifiers, or
#   the reserved name "Sleep"
# - Referenced types in arg_type must exist in the system
# - Argument expressions must be valid Ada syntax
# - Component and command names must match instances in the assembly
