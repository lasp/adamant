---
description: |
  Static commands for the Simple Command Sequencer component. Per-sequence
  commands (one per declared sequence) are synthesised at assembly
  load time by gen/models/simple_command_sequencer_commands.py.
commands:
  - name: Run_Sequence
    description: Run a command sequence by ID. The synthesised per-sequence commands are the operator-friendly form; this is the underlying backbone they all dispatch through. Response behavior is the sequence's static configuration from the sequences model.
    arg_type: Run_Sequence_Arg.T

  - name: Kill_All_Sequences
    description: |
      Halt every running sequence and return all frames to their initial state.
      Does not affect frames that were not running. Killing a sequence that is
      waiting for a command response does not cancel that command: its response
      can still arrive after the frame has been released and a new sequence has
      claimed it. The sequencer ignores a late response whose command id does
      not match the step the new sequence is waiting on, but one with a matching
      id would wake that step early.

  - name: Kill_Frame
    description: |
      Halt the sequence running on a single frame and return that frame to its
      initial state. Fails if the frame ID is out of range; killing a frame that
      is not running has no effect and succeeds. Killing a frame that is waiting
      for a command response does not cancel that command: its response can
      still arrive after the frame has been released and a new sequence has
      claimed it. The sequencer ignores a late response whose command id does
      not match the step the new sequence is waiting on, but one with a matching
      id would wake that step early.
    arg_type: Packed_U16.T

  - name: Set_Summary_Packet_Period
    description: Set the period of the sequencer summary packet, in ticks. A period of zero disables the packet.
    arg_type: Packed_U16.T
