---
description: |
  The Command Sequencer component executes predefined sequences of commands.
  It receives high-level sequence commands and breaks them down into individual
  sub-commands that are sent to the command router. The sequencer handles
  command response tracking, timeouts, and failure modes.

execution: active
init:
  parameters:
    - name: Config
      type: Simple_Sequencer_Types.Sequencer_Config
      description: The sequencer's static configuration, exported as the Config constant by the generated
        command sequences suite package. Carries the sequence table and the sizes of the two frame pools
        (for sequences that wait for sub-command responses and for those that do not), which together
        also size the suite's generated summary packet type.
connectors:
  - type: Command.T
    kind: recv_async
    description: Sequence commands are received on this connector
  - type: Command.T
    kind: send
    description: Sub-commands are sent out this connector
  - type: Command_Response.T
    kind: send
    description: Sends the response to a Run_Sequence (or synthesised per-sequence) command back to the command router, either at dispatch or, for Send_After_Sequence_Completion sequences, when the sequence ends.
  - type: Command_Response.T
    kind: recv_async
    description: Responses to sub-commands are received here, advancing the waiting sequence. At startup the command router sends a Register_Source message per frame via this connector with the source identifier the frame stamps into its commands. Include one arrayed connector entry per frame of either pool; a frame that never receives one can never be claimed.
  - description: The packet send connector, used for sending the periodic sequencer summary packet.
    type: Packet.T
    kind: send
  - description: Data products are sent out of this connector.
    type: Data_Product.T
    kind: send
  - type: Tick.T
    kind: recv_async
    description: Tick for managing timeouts and delays
  - type: Event.T
    kind: send
    description: Events are sent out of this connector
  - description: The system time is retrieved via this connector.
    return_type: Sys_Time.T
    kind: get