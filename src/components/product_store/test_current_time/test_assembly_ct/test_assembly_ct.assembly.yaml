---
description: This is an assembly for testing the product store component with a store configured to save the current time.
with:
  - Test_Assembly_Ct_Stored_Products
  - Test_Store_Memory_Ct
########################################
components:
########################################
  - type: Test_Component_1
    execution: passive
    set_id_bases:
      - "Data_Product_Id_Base => 100"
  - type: Product_Store
    execution: passive
    init_base:
      - "Queue_Size => 512"
    discriminant:
      - "Store_Description => Test_Assembly_Ct_Stored_Products.Store_Description'Access"
    init:
      - "Bytes_A => Test_Store_Memory_Ct.Store_Bytes_A'Access"
      - "Bytes_B => Test_Store_Memory_Ct.Store_Bytes_B'Access"
