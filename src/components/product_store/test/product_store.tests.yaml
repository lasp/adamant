---
description: This is a unit test suite for the Product Store component.
tests:
  - name: Test_Set_Up_Seeding
    description: This unit test tests that the counter data products are seeded with zero at Set_Up.
  - name: Test_Nominal_Save
    description: This unit test tests saving the data products to the store upon receipt of a tick.
  - name: Test_Nominal_Restore
    description: This unit test tests restoring the data products from the store by command, including all of the restore timestamp modes.
  - name: Test_Restore_On_Set_Up
    description: This unit test tests restoring the data products from the store at Set_Up, both with a valid and an invalid store.
  - name: Test_Crc_Invalid_On_Restore
    description: This unit test tests the component's response to a restore command when the store contents are corrupted.
  - name: Test_Save_Command
    description: This unit test tests saving the data products to the store by command.
  - name: Test_Save_On_Tick_Enable_Disable
    description: This unit test tests disabling and enabling the automatic saving of data products on tick by command.
  - name: Test_Ticks_Per_Save
    description: This unit test tests the tick divider, which saves the data products only every Ticks_Per_Save ticks.
  - name: Test_Missing_Data_Product
    description: This unit test tests the component's response to a data product that is missing from the database on save, verifying that slots keep the values from the most recent valid save and that never-saved slots restore nothing.
  - name: Test_Id_Out_Of_Range
    description: This unit test tests the component's response to a data product id reported as out of range by the database on save, which produces an unmaskable event.
  - name: Test_Length_Mismatch
    description: This unit test tests the component's response to a fetched data product with an unexpected length.
  - name: Test_Dump_Store
    description: This unit test tests dumping the contents of both store copies into packets by command.
  - name: Test_Mid_Save_Reboot_Recovery
    description: This unit test tests that a reboot in the middle of a save (simulated by corrupting the copy that the next save would write) costs only one save of freshness, with the restore falling back to the intact copy and subsequent saves recovering the corrupted copy.
  - name: Test_Offset_Memory_Regions
    description: This unit test tests that the component operates correctly when given byte arrays that are larger than the store size and that have nonzero first indices, verifying that only the first Store_Size bytes of each allocation are used.
  - name: Test_Invalid_Command
    description: This unit test tests the component's response to an invalid command.
  - name: Test_Full_Queue
    description: This unit test tests a command being dropped due to a full queue.
  - name: Test_Restore_Skips_Unwritten
    description: This unit test tests that a restore silently skips store entries that have never been saved, leaving those data products unavailable in the database.
  - name: Test_Stored_Length_Mismatch
    description: This unit test tests that a restore refuses a store entry whose stored length does not match the expected length, which indicates the stored products model has changed since the store was written.
