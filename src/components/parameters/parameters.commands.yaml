---
description: These are the commands for the Parameters component.
commands:
  - name: Update_Parameter
    description: Update the active parameter value in a component for a parameter table entry with the given ID, Length, and Value. The value is staged, the component's parameter validation is run, and only then is the update applied. If validation fails the staged value is discarded and the command fails. Parameters that only validate together must therefore be changed by table upload. If multiple parameters share the same entry ID (grouped parameters), all will be updated.
    arg_type: Parameter_Table_Entry.T
  - name: Dump_Parameters
    description: Produce a packet with the currently staged parameter values contained within connected components.
