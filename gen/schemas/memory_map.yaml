---
# This schema describes the yaml format for a memory_map.
type: map
mapping:
  # Description of the memory_map.
  description:
    type: str
    required: False
  # Any useful handcode to include in the .ads file can be included here.
  # You can think of this as inline Ada, which might be useful for declaring
  # custom enum types and the like.
  preamble:
    type: str
    required: False
  # Many "with" dependencies are automatically deduced and included by
  # the generator. If you want to manually add a "with" statement, you
  # can list the names of the packages here.
  with:
    seq:
      - type: str
    required: False
  # The start address of this memory map region.
  start_address:
    type: int
    required: True
  # The length of this memory map region.
  length:
    type: int
    required: True
  # The alignment, in bytes, of items that do not specify their own. An item
  # is placed at an address that is a multiple of its alignment. If not
  # specified the default value is an alignment of 1, which means items are
  # laid out contiguously, each starting on the byte after the previous one.
  alignment:
    type: int
    required: False
  # List of items to include in the memory map.
  items:
    seq:
      - type: map
        mapping:
          # Name of the item.
          name:
            type: str
            required: True
          # Description of the item.
          description:
            type: str
            required: False
          # The type of the item. Using a packed record or packed
          # array type is recommended here. The size of a packed type
          # is known to the model, and the type is checked to make sure
          # every bit pattern it can hold is valid. Any other Ada type
          # may be used if it is declared in the preamble or in a package
          # listed in "with". The size of such a type is not known to the
          # model, so a "size" must be provided for the item.
          type:
            type: str
            required: True
          # The offset of the item, in bytes, from the start address of
          # the memory map. If not specified the item is placed at the
          # first aligned address after the item listed before it. Giving
          # an item an offset keeps its address from moving when items
          # listed before it are added, removed, or change size.
          offset:
            type: int
            required: False
          # The number of bytes reserved for the item. This must be at
          # least the size of the type, and is required for a type that is
          # not a packed type. If not specified the size of the type is
          # reserved. Reserving more than the size of the type leaves room
          # for the type to grow without moving the items that follow it.
          size:
            type: int
            required: False
          # The alignment of the item, in bytes. If not specified the
          # alignment of the memory map is used.
          alignment:
            type: int
            required: False
          # The value of the item. This is usually left unspecified, but may
          # be required in special circumstances where you want to initialize
          # some value in non-volatile storage at every boot.
          value:
            type: str
            required: False
    # A memory_map must have at least one item.
    range:
      min: 1
    required: True
